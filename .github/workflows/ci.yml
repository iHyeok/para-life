name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # multichat/build/main.js is committed; the bundler output is only reproducible with the same Bun
  BUN_VERSION: 1.3.11
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome lint

  channel:
    name: Channel server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  site:
    name: Site tests, build and dist check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:dist

  multichat-build:
    name: Multichat bundle is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multichat
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Committed build/main.js matches a fresh build
        run: |
          if ! git diff --exit-code --stat -- build/; then
            echo "::error::multichat/build/main.js is stale: run 'bun run build' in multichat/ and commit the result"
            exit 1
          fi

  e2e:
    name: Multichat end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site.spec.ts checks the built dashboard's layout
      - run: npm ci && npm run build
        working-directory: site
      - run: bun install --frozen-lockfile
        working-directory: channel
      - run: bun install --frozen-lockfile
        working-directory: multichat
      - run: npx playwright install --with-deps chromium
        working-directory: multichat
      - run: npx playwright test
        working-directory: multichat
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: multichat/test-results/
          retention-days: 7
